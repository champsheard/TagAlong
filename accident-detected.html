<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F2F0E8" />
    <meta
      name="description"
      content="Tagalong accident alert status for a trip."
    />
    <title>Accident detected · Tagalong</title>
    <style>
      :root {
        color-scheme: light;
        --evergreen: #193c32;
        --evergreen-deep: #122f28;
        --oat: #f2f0e8;
        --paper: #fbfaf5;
        --citron: #b8ce73;
        --muted: #53665a;
        --line: #d7d9cb;
        --pale-green: #e5e9da;
        --red: #8c3026;
        --red-bg: #f6e2dc;
        --amber: #82500b;
        --amber-bg: #f6e9c9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 50% 45%, rgba(229, 233, 218, 0.5), transparent 58%),
          var(--oat);
        color: var(--evergreen);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .site-header {
        width: min(100%, 1120px);
        margin: 0 auto;
        padding: 22px 28px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        color: inherit;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border: 1px solid rgba(184, 206, 115, 0.5);
        border-radius: 16px;
        background: var(--evergreen);
        color: var(--citron);
        font-family: Georgia, serif;
        font-size: 22px;
        font-weight: 700;
      }

      .brand-name {
        display: block;
        font-size: 16px;
        font-weight: 850;
        letter-spacing: -0.35px;
      }

      .brand-tagline {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
      }

      main {
        display: grid;
        min-height: calc(100vh - 88px);
        place-items: center;
        padding: 20px 22px 56px;
      }

      .alert-card {
        width: min(100%, 570px);
        padding: clamp(26px, 6vw, 42px);
        border: 1px solid var(--line);
        border-radius: 26px;
        background: var(--paper);
        box-shadow: 0 22px 60px rgba(25, 60, 50, 0.08);
      }

      .alert-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 30px;
        padding: 6px 11px;
        border: 1px solid #e9c8bf;
        border-radius: 999px;
        background: var(--red-bg);
        color: var(--red);
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .alert-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--red);
      }

      .alert-icon {
        display: grid;
        width: 70px;
        height: 70px;
        margin: 26px 0 20px;
        place-items: center;
        border-radius: 23px;
        background: var(--red-bg);
        color: var(--red);
      }

      h1 {
        margin: 0;
        color: var(--evergreen);
        font-size: clamp(32px, 7vw, 46px);
        font-weight: 900;
        letter-spacing: -1.8px;
        line-height: 1.06;
      }

      .summary {
        max-width: 430px;
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.65;
      }

      .contact-confirmation {
        display: flex;
        align-items: flex-start;
        gap: 13px;
        margin-top: 27px;
        padding: 17px;
        border: 1px solid #d6ddc5;
        border-radius: 17px;
        background: var(--pale-green);
      }

      .check-icon {
        display: grid;
        flex: 0 0 30px;
        width: 30px;
        height: 30px;
        place-items: center;
        border-radius: 50%;
        background: var(--paper);
        color: var(--evergreen);
      }

      .contact-label {
        margin: 1px 0 4px;
        color: var(--muted);
        font-size: 9px;
        font-weight: 900;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .contact-message {
        margin: 0;
        color: var(--evergreen);
        font-size: 15px;
        font-weight: 850;
        line-height: 1.45;
      }

      .help-note {
        margin-top: 23px;
        padding: 14px 15px;
        border-left: 3px solid #c3933d;
        border-radius: 0 12px 12px 0;
        background: var(--amber-bg);
      }

      .help-title {
        margin: 0 0 3px;
        color: var(--amber);
        font-size: 13px;
        font-weight: 850;
      }

      .help-copy {
        margin: 0;
        color: #624813;
        font-size: 12px;
        line-height: 1.55;
      }

      .return-link {
        display: flex;
        min-height: 50px;
        align-items: center;
        justify-content: center;
        margin-top: 24px;
        padding: 12px 18px;
        border: 1px solid var(--evergreen);
        border-radius: 15px;
        background: var(--evergreen);
        color: #fffefa;
        font-size: 14px;
        font-weight: 800;
        text-decoration: none;
        transition: background-color 140ms ease, transform 140ms ease;
      }

      .return-link:hover {
        transform: translateY(-1px);
        background: var(--evergreen-deep);
      }

      .return-link:focus-visible,
      .brand:focus-visible {
        outline: 3px solid var(--citron-dark, #6a7f3e);
        outline-offset: 4px;
      }

      .page-note {
        margin: 20px 0 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.5;
        text-align: center;
      }

      @media (max-width: 480px) {
        .site-header {
          padding: 17px 20px;
        }

        main {
          min-height: calc(100vh - 76px);
          align-items: start;
          padding: 18px 16px 34px;
        }

        .alert-card {
          border-radius: 23px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Tagalong home">
        <span class="brand-mark" aria-hidden="true">T</span>
        <span>
          <span class="brand-name">Tagalong</span>
          <span class="brand-tagline">A steadier way home</span>
        </span>
      </a>
    </header>

    <main>
      <!-- Show this confirmed state only after the server confirms alert delivery. -->
      <section class="alert-card" aria-labelledby="page-title">
        <div class="alert-label">
          <span class="alert-dot" aria-hidden="true"></span>
          Accident alert
        </div>

        <div class="alert-icon" aria-hidden="true">
          <svg width="38" height="38" viewBox="0 0 40 40" fill="none">
            <path
              d="M20 4.5 36 33H4L20 4.5Z"
              stroke="currentColor"
              stroke-width="2.7"
              stroke-linejoin="round"
            />
            <path d="M20 14v9" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
            <circle cx="20" cy="28" r="1.8" fill="currentColor" />
          </svg>
        </div>

        <h1 id="page-title">Accident detected</h1>
        <p class="summary">Tagalong detected a possible accident during your trip.</p>

        <div class="contact-confirmation" role="status" aria-live="polite">
          <span class="check-icon" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 20 20" fill="none">
              <path d="m4 10.2 3.7 3.7L16 5.8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <div>
            <p class="contact-label">Trusted contacts</p>
            <p class="contact-message">Your trusted contacts were alerted.</p>
          </div>
        </div>

        <aside class="help-note" aria-label="Emergency help information">
          <p class="help-title">Need immediate help?</p>
          <p class="help-copy">Call your local emergency services. Tagalong does not contact them for you.</p>
        </aside>

        <a class="return-link" href="/">Return to Tagalong</a>
      </section>
    </main>
  </body>
</html>
